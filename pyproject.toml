[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "notemanager"
version = "0.1.0"
description = "本地笔记管理工具，支持 rst 和 markdown 格式"
requires-python = ">=3.10"
dependencies = [
    "docutils>=0.20",
    "Markdown>=3.4",
    "pygments>=2.14",
    "watchdog>=3.0",
]

[tool.setuptools.packages.find]
include = ["notemanager*"]

[project.scripts]
notemanager = "notemanager.cli:main"
nmr = "notemanager.cli:main"
