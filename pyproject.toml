[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "notemanager"
dynamic = ["version"]
description = "Note manager with CLI daemon and WebUI, supporting rst, markdown and plain text notes"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
    {name = "Kenneth Lee", email = "kenneth-lee-2012@qq.com"},
]
keywords = ["notes", "note-management", "markdown", "rst", "knowledge-base", "webui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Editors",
    "Topic :: Utilities",
]
dependencies = [
    "docutils>=0.20",
    "Markdown>=3.4",
    "pygments>=2.14",
    "watchdog>=3.0",
]

[project.urls]
Homepage = "https://github.com/Kenneth-Lee/NoteManager"
Issues = "https://github.com/Kenneth-Lee/NoteManager/issues"

[project.scripts]
notemanager = "notemanager.cli:main"
nmr = "notemanager.cli:main"

[tool.setuptools.dynamic]
version = {attr = "notemanager.__version__"}

[tool.setuptools.packages.find]
include = ["notemanager*"]

# renderer/assets 下的 js/css/字体是 Web UI 的运行时资源，
# 不配置 package-data 它们不会进 wheel，安装后 Web UI 会坏
[tool.setuptools.package-data]
"notemanager.renderer" = ["assets/**/*"]
